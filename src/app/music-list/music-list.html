@for (item of music; track item.id) {
  <app-music-list-item
    [item]="item"
    [class.even]="$even"
    [class.odd]="$odd"
    [class.first]="$first"
    [class.last]="$last"
    (itemClicked)="handleItemClick($event)">
  </app-music-list-item>
} @empty {
  <p>No music entries found.</p>
}

<div id="Dot-Matrix-value"></div>
