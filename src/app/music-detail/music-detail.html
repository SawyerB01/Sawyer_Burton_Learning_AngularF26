

@if (music()) {
  <h2>{{ music()!.name }}</h2>
  <p>Year: {{ music()!.year }}</p>
  <p>Category: {{ music()!.category }}</p>
  <p>Released: {{ music()!.dateReleased }}</p>
  <p>Description: {{ music()!.description }}</p>

  @if (music()!.img) {
    <img [src]="music()!.img" [alt]="music()!.name">
  }

  <p>
    <a [routerLink]="['/music/edit', music()!.id]">Edit</a>
  </p>
} @else {
  <p>Item not found</p>
}
