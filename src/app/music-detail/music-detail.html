

@if (item) {
  <h2>{{ item!.name }}</h2>
  <p>Year: {{ item!.year }}</p>
  <p>Category: {{ item!.category }}</p>
  <p>Released: {{ item!.dateReleased }}</p>
  <p>Description: {{ item!.description }}</p>

  @if (item.img) {
    <img [src]="item.img" [alt]="item.name">
  }

  <p>
    <a [routerLink]="['/music/edit', item.id]">Edit</a>
  </p>
} @else {
  <p>Item not found</p>
}
